<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0817">
<title>عفاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,500&display=swap">
<style>
:root{
  --night:#0f0817;--plum:#2a1336;--rose:#f2a7b8;--gold:#f3c56b;--cream:#fff4e8;--muted:#a993b4;--paper:#f7ecdc;--ink:#3a1f2b;
  --display:"Aref Ruqaa","Amiri",serif;--body:"Reem Kufi","Tahoma",sans-serif;--latin:"Fraunces",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 80% 50% at 50% 64%,rgba(243,197,107,.13),transparent 70%),
  radial-gradient(ellipse 120% 90% at 50% 50%,transparent 55%,rgba(5,2,9,.85))}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 26px) max(18px,env(safe-area-inset-left,0px));
  opacity:0;transition:opacity 1.2s ease}
.hud.on{opacity:1}
.top{display:flex;flex-direction:column;align-items:center;gap:2px}
.date{font-family:var(--latin);font-style:italic;font-weight:300;color:var(--gold);font-size:13px;letter-spacing:.14em;direction:ltr;text-transform:lowercase}
h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,120px);line-height:1.05;margin:0;color:var(--cream);
  text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 34px rgba(242,167,184,.35)}
.nick{font-family:var(--display);color:var(--rose);font-size:clamp(18px,5.2vw,26px);margin:0;opacity:.95}
.count{margin-top:10px;font-family:var(--latin);font-size:13px;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.count b{color:var(--cream);font-weight:500}

.bottom{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto;transition:opacity .6s,transform .6s;
  background:rgba(15,8,23,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(243,197,107,.22);border-radius:6px;padding:14px 20px 8px;max-width:340px}
.bottom.gone{opacity:0;transform:translateY(12px);pointer-events:none}
.hint{margin:0;color:var(--cream);font-size:15px;line-height:1.7;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.blow{appearance:none;border:0;background:none;color:var(--gold);font-family:var(--body);font-size:17px;font-weight:500;cursor:pointer;
  padding:12px 6px;display:inline-flex;align-items:center;gap:10px;position:relative}
.blow::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.blow svg{width:20px;height:20px;flex:none}
.blow:active{transform:scale(.97)}
.blow:focus-visible{outline:1px dashed var(--gold);outline-offset:4px}
.meter{width:140px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .4s}
.meter.on{opacity:1}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .08s linear}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--night);
  transition:opacity 1s ease,visibility 1s;padding:24px}
.intro.out{opacity:0;visibility:hidden}
.intro p{margin:0;font-family:var(--display);font-size:22px;color:var(--cream);text-align:center;line-height:1.6}
.intro small{font-family:var(--latin);font-style:italic;color:var(--muted);font-size:13px;letter-spacing:.1em;direction:ltr}
.env{width:min(250px,64vw);aspect-ratio:1.5;position:relative;cursor:pointer;border:0;padding:0;background:none;animation:float 3.4s ease-in-out infinite}
.env .body{position:absolute;inset:0;background:var(--paper);border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.env .flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 58%);background:#eadbc6;transform-origin:top;transition:transform .7s ease;z-index:2}
.env .side{position:absolute;inset:0;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);background:#f1e3cf}
.env .seal{position:absolute;left:50%;top:52%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 35% 30%,#d24b5f,#8e1f33 70%);box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 0 0 4px rgba(0,0,0,.08);
  display:grid;place-items:center;font-family:var(--display);color:#f7d9d0;font-size:22px;transition:transform .5s,opacity .5s}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{transform:scale(1.4);opacity:0}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}

/* ---------- letter ---------- */
.letter{position:fixed;z-index:15;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,120%);
  width:min(420px,calc(100% - 28px));max-height:72vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:4px;
  padding:26px 22px 20px;box-shadow:0 -10px 50px rgba(0,0,0,.55);transition:transform 1s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(58,31,43,.08) 33px 34px)}
.letter.show{transform:translate(-50%,0)}
.letter h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 6px;color:#8e1f33;line-height:1.2}
.letter .txt{font-family:var(--display);font-size:19px;line-height:34px;min-height:238px;white-space:pre-wrap}
.letter .txt .cur{display:inline-block;width:1px;height:20px;background:var(--ink);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.letter .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.letter .sig{font-family:var(--display);font-size:20px;color:#8e1f33}
.letter button{appearance:none;border:0;background:none;font-family:var(--body);font-size:13px;color:#7a5a66;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.letter .close{position:absolute;top:8px;left:10px;font-size:22px;text-decoration:none;color:#9b7f88;padding:4px 8px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);z-index:25;
  background:rgba(42,19,54,.92);color:var(--cream);font-size:14px;padding:10px 16px;border-radius:4px;transition:transform .5s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.env{animation:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="hud" id="hud">
  <div class="top">
    <span class="date">the seventh of november</span>
    <h1>عفاف</h1>
    <p class="nick">العفّة وألعاب الخفّة</p>
    <div class="count" id="count"></div>
  </div>
  <div class="bottom" id="bottom">
    <p class="hint" id="hint" dir="ltr">allow acces ll mic and nesfi fl mic</p>
    <button class="blow" id="blow" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>
      7ali mic
    </button>
    <div class="meter" id="meter"><i></i></div>
  </div>
</div>

<div class="intro" id="intro">
  <small>made with love by yamii</small>
  <button class="env" id="env" type="button" aria-label="افتحي">
    <span class="body"></span><span class="side"></span><span class="flap"></span><span class="seal">ع</span>
  </button>
  <p>وصلتك رسالة<br><span style="font-size:17px;color:var(--gold);font-family:var(--latin);font-style:italic;direction:ltr;display:inline-block">click bach t7aliha</span></p>
</div>

<div class="letter" id="letter">
  <button class="close" id="close" type="button" aria-label="إغلاق">×</button>
  <h2>كلُّ عامٍ وأنتِ بخيرٍ يا عفاف</h2>
  <div class="txt" id="txt"></div>
  <div class="row">
    <span class="sig">— يامي ♥</span>
    <button id="again" type="button" dir="ltr">click again if u want the candles back</button>
  </div>
  <p style="margin:12px 0 0;text-align:center;font-family:var(--latin);font-style:italic;font-size:13px;color:#9b7f88;direction:ltr">made with love by yamii</p>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const LETTER="عفاف… اسمٌ نال من معناه أوفر نصيب؛ عفّةٌ في الروح، ونقاءٌ في القلب، وصفاءٌ يشبه ضوء الفجر.\nوفي ختام هذه الجمعة المباركة يطلّ عامٌ جديد من عمركِ، فأسأل الله أن يجعله عامَ فرحٍ لا ينقطع، وأمانيَّ تتحقّق واحدةً تلو الأخرى.\nدمتِ كما عهدناكِ: خفيفةَ الظلّ، ساحرةَ الخفّة، ونورًا يضيء كلّ مجلس.";

/* ================= renderer ================= */
const canvas=$('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x0f0817);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0f0817,16,40);
const camera=new THREE.PerspectiveCamera(45,1,.1,120);

scene.add(new THREE.HemisphereLight(0xffe7d6,0x2a1336,.5));
const key=new THREE.DirectionalLight(0xffffff,.6);key.position.set(4,9,6);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;scene.add(key);
const rim=new THREE.DirectionalLight(0xf2a7b8,.7);rim.position.set(-6,4,-5);scene.add(rim);
const warm=new THREE.PointLight(0xffa94d,2,10,2);warm.position.set(0,4,0);scene.add(warm);
const fwLight=new THREE.PointLight(0xffffff,0,40,1.5);fwLight.position.set(0,9,-8);scene.add(fwLight);

const M=(c,r=.55,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

/* floor + table */
const floor=new THREE.Mesh(new THREE.CircleGeometry(30,64),M(0x170c22,.95));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const table=new THREE.Mesh(new THREE.CylinderGeometry(3.6,3.6,.18,72),M(0x3a1f2b,.6));table.position.y=.09;table.receiveShadow=true;table.castShadow=true;scene.add(table);
const cloth=new THREE.Mesh(new THREE.CylinderGeometry(3.62,3.9,.6,72,1,true),new THREE.MeshStandardMaterial({color:0x2a1336,roughness:.9,side:THREE.DoubleSide}));cloth.position.y=-.12;scene.add(cloth);

/* ================= cake ================= */
const cake=new THREE.Group();scene.add(cake);
const BASE=.18;
const plate=new THREE.Mesh(new THREE.CylinderGeometry(2.55,2.4,.1,64),M(0xf3eee8,.2,.15));plate.position.y=BASE+.05;plate.receiveShadow=plate.castShadow=true;cake.add(plate);

function tier(r,h,y,body,icing,pearl){
  const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,72),M(body,.75));b.position.y=y+h/2;b.castShadow=b.receiveShadow=true;cake.add(b);
  const top=new THREE.Mesh(new THREE.CylinderGeometry(r+.05,r+.05,.12,72),M(icing,.3));top.position.y=y+h;top.castShadow=true;cake.add(top);
  for(let i=0;i<26;i++){
    const a=i/26*Math.PI*2+Math.random()*.08,len=.15+Math.random()*.38;
    const d=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,len,10),M(icing,.3));d.position.set(Math.cos(a)*(r+.04),y+h-len/2,Math.sin(a)*(r+.04));cake.add(d);
    const tip=new THREE.Mesh(new THREE.SphereGeometry(.075,10,10),M(icing,.3));tip.position.set(d.position.x,y+h-len,d.position.z);cake.add(tip);
  }
  const n=Math.round(r*17);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const p=new THREE.Mesh(new THREE.SphereGeometry(.085,12,12),M(pearl,.18,.7));p.position.set(Math.cos(a)*(r+.02),y+.09,Math.sin(a)*(r+.02));cake.add(p)}
}
tier(1.95,1.15,BASE+.1,0xf2a7b8,0xfff4e8,0xf3c56b);
const T2=BASE+.1+1.15+.06;
tier(1.35,.95,T2,0x8a4fa0,0xf2a7b8,0xfff4e8);
const TOP=T2+.95+.06;

for(let i=0;i<0;i++){const a=i/5*Math.PI*2+.3;
  const s=new THREE.Mesh(new THREE.SphereGeometry(.16,16,16),M(0xd8324a,.3));s.scale.y=1.25;s.position.set(Math.cos(a)*1.68,T2+.12,Math.sin(a)*1.68);s.castShadow=true;cake.add(s);
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.09,.08,5),M(0x3f8a4e,.5));leaf.position.set(s.position.x,s.position.y+.22,s.position.z);cake.add(leaf);}
const spC=[0xf3c56b,0xfff4e8,0x7fd3c8,0xf2a7b8];
for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*1.25;
  const s=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.13,6),M(spC[i%4],.4));s.position.set(Math.cos(a)*rr,TOP,Math.sin(a)*rr);s.rotation.set(Math.PI/2,0,Math.random()*Math.PI);cake.add(s);}

/* name plaque (canvas texture, drawn after fonts load) */
const pc=document.createElement('canvas');pc.width=512;pc.height=256;
const ptex=new THREE.CanvasTexture(pc);ptex.encoding=THREE.sRGBEncoding;
function drawPlaque(){
  const g=pc.getContext('2d');g.clearRect(0,0,512,256);
  g.fillStyle='#3b1d17';roundRect(g,8,30,496,196,96);g.fill();
  g.strokeStyle='#f3c56b';g.lineWidth=6;roundRect(g,22,44,468,168,84);g.stroke();
  g.fillStyle='#fff4e8';g.font='700 118px "Aref Ruqaa", serif';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';g.fillText('عفاف',256,132);
  ptex.needsUpdate=true;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
drawPlaque();
(document.fonts?document.fonts.load('700 118px "Aref Ruqaa"'):Promise.resolve()).then(drawPlaque).catch(()=>{});
const plaque=new THREE.Mesh(new THREE.PlaneGeometry(1.25,.625),new THREE.MeshStandardMaterial({map:ptex,transparent:true,roughness:.5,side:THREE.DoubleSide}));
plaque.position.set(0,TOP+.42,.15);plaque.rotation.x=-.18;cake.add(plaque);

/* candles */
const flames=[],hits=[];
const N=8;
for(let i=0;i<N;i++){
  const a=i/N*Math.PI*2+Math.PI/N,rr=1.02,x=Math.cos(a)*rr,z=Math.sin(a)*rr,h=.72;
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,h,16),M(i%2?0xfff4e8:0x7fd3c8,.4));c.position.set(x,TOP+h/2,z);c.castShadow=true;cake.add(c);
  for(let k=0;k<4;k++){const st=new THREE.Mesh(new THREE.TorusGeometry(.057,.012,6,16),M(i%2?0xf2a7b8:0xfff4e8,.4));st.rotation.x=Math.PI/2;st.position.set(x,TOP+.12+k*.16,z);cake.add(st)}
  const wick=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.08,6),M(0x1a1a1a));wick.position.set(x,TOP+h+.04,z);cake.add(wick);
  const f=new THREE.Group();
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.2,16,16),new THREE.MeshBasicMaterial({color:0xffa94d,transparent:true,opacity:.13,depthWrite:false}));
  const outer=new THREE.Mesh(new THREE.SphereGeometry(.085,16,16),new THREE.MeshBasicMaterial({color:0xffbe55}));outer.scale.set(1,2.2,1);
  const inner=new THREE.Mesh(new THREE.SphereGeometry(.045,12,12),new THREE.MeshBasicMaterial({color:0xfffbe8}));inner.scale.set(1,1.8,1);inner.position.y=-.03;
  f.add(halo,outer,inner);f.position.set(x,TOP+h+.22,z);cake.add(f);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(.38,8,8),new THREE.MeshBasicMaterial({visible:false}));hit.position.copy(f.position);hit.userData.i=i;cake.add(hit);hits.push(hit);
  flames.push({g:f,phase:Math.random()*6,base:f.position.clone(),on:true,s:1,lean:0});
}

/* cats running around the cake */
const cats=[];
function makeCat(fur,belly,eye,stripes){
  const c=new THREE.Group(),m=M(fur,.85),mb=M(belly,.85);
  const body=new THREE.Mesh(new THREE.SphereGeometry(.2,20,16),m);body.scale.set(1.35,.8,.78);body.position.y=.25;body.castShadow=true;c.add(body);
  const chest=new THREE.Mesh(new THREE.SphereGeometry(.12,14,12),mb);chest.position.set(.17,.22,0);chest.scale.set(.8,1,1);c.add(chest);
  const head=new THREE.Group();head.position.set(.27,.39,0);c.add(head);
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.14,20,16),m);hd.scale.set(.95,.9,1.05);hd.castShadow=true;head.add(hd);
  const muz=new THREE.Mesh(new THREE.SphereGeometry(.065,12,10),mb);muz.position.set(.11,-.035,0);muz.scale.set(.8,.75,1.2);head.add(muz);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.018,8,8),M(0xe48a9a,.4));nose.position.set(.16,-.01,0);head.add(nose);
  for(const s of[-1,1]){
    const ear=new THREE.Mesh(new THREE.ConeGeometry(.055,.11,4),m);ear.position.set(-.01,.13,s*.075);ear.rotation.set(s*-.25,0,-.15);head.add(ear);
    const inn=new THREE.Mesh(new THREE.ConeGeometry(.03,.07,4),M(0xf2a7b8,.6));inn.position.set(.012,.125,s*.075);inn.rotation.set(s*-.25,0,-.15);head.add(inn);
    const e=new THREE.Mesh(new THREE.SphereGeometry(.026,10,10),new THREE.MeshStandardMaterial({color:eye,roughness:.1,emissive:eye,emissiveIntensity:.35}));e.position.set(.115,.03,s*.055);head.add(e);
    const pu=new THREE.Mesh(new THREE.SphereGeometry(.013,8,8),M(0x111111,.1));pu.position.set(.137,.03,s*.056);pu.scale.set(.6,1.3,.6);head.add(pu);
  }
  const legs=[];
  [[.14,.08],[.14,-.08],[-.14,.08],[-.14,-.08]].forEach(([x,z],i)=>{
    const piv=new THREE.Group();piv.position.set(x,.22,z);c.add(piv);
    const l=new THREE.Mesh(new THREE.CylinderGeometry(.035,.03,.2,8),m);l.position.y=-.1;piv.add(l);
    const paw=new THREE.Mesh(new THREE.SphereGeometry(.038,8,8),mb);paw.position.set(.01,-.2,0);paw.scale.set(1.3,.7,1);piv.add(paw);
    legs.push(piv);
  });
  const tail=[];let prev=c;const tpos=new THREE.Group();tpos.position.set(-.26,.3,0);c.add(tpos);prev=tpos;
  for(let i=0;i<7;i++){const seg=new THREE.Group();seg.position.set(i?-.055:0,i?.02:0,0);
    const s=new THREE.Mesh(new THREE.SphereGeometry(.035-i*.002,8,8),(stripes&&i%2)?M(stripes,.85):m);seg.add(s);prev.add(seg);prev=seg;tail.push(seg)}
  if(stripes){for(let i=0;i<3;i++){const st=new THREE.Mesh(new THREE.TorusGeometry(.16,.018,6,16,Math.PI),M(stripes,.85));st.position.set(-.1+i*.1,.25,0);st.rotation.y=Math.PI/2;st.scale.set(1,.82,.78);c.add(st)}}
  c.userData={legs,tail,head};
  return c;
}
[[0xf0a050,0xfff4e8,0x7cc45a,0xc06a28],[0x222026,0x3a3740,0xf3c56b,null],[0xf4efe9,0xffffff,0x6ab7e8,0x9a9aa6]].forEach((cfg,i)=>{
  const cat=makeCat(...cfg);cat.scale.setScalar(1.15);cake.add(cat);
  cat.userData.a0=i/3*Math.PI*2;cat.userData.speed=.9+i*.12;cat.userData.ph=i*1.7;cat.userData.jump=0;
  cat.traverse(o=>{if(o.isMesh)o.userData.cat=cat});cats.push(cat);
});
function meow(){const c=ac();if(!c)return;const o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;
  o.type='sawtooth';o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(820,t+.18);o.frequency.linearRampToValueAtTime(430,t+.55);
  f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1600,t+.2);f.frequency.linearRampToValueAtTime(700,t+.55);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.06);g.gain.linearRampToValueAtTime(.15,t+.4);g.gain.exponentialRampToValueAtTime(.001,t+.62);
  o.connect(f).connect(g).connect(c.destination);o.start(t);o.stop(t+.65)}

/* gifts on the table */
function gift(x,z,s,col,rib,rot){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(s,s*.8,s),M(col,.6));b.position.y=s*.4;b.castShadow=true;g.add(b);
  const r1=new THREE.Mesh(new THREE.BoxGeometry(s*1.01,s*.81,s*.16),M(rib,.3,.4));r1.position.y=s*.4;g.add(r1);
  const r2=r1.clone();r2.rotation.y=Math.PI/2;g.add(r2);
  for(const sgn of[-1,1]){const bow=new THREE.Mesh(new THREE.TorusGeometry(s*.16,s*.05,8,16),M(rib,.3,.4));bow.position.set(sgn*s*.14,s*.88,0);bow.rotation.set(0,Math.PI/2,sgn*.6);g.add(bow)}
  g.position.set(x,BASE,z);g.rotation.y=rot;scene.add(g);
}
gift(2.85,1.2,.62,0x7fd3c8,0xf3c56b,.4);
gift(-2.9,.9,.5,0xf3c56b,0x8e1f33,-.3);
gift(-2.5,1.9,.36,0xf2a7b8,0xfff4e8,.9);

/* balloons */
const balloons=[];
const bCols=[0xf2a7b8,0xf3c56b,0x8a4fa0,0x7fd3c8,0xd8324a,0xfff4e8,0xf2a7b8];
for(let i=0;i<7;i++){
  const g=new THREE.Group();
  const col=bCols[i];
  const b=new THREE.Mesh(new THREE.SphereGeometry(.55,32,32),new THREE.MeshStandardMaterial({color:col,roughness:.18,metalness:.15}));b.scale.y=1.18;g.add(b);
  const knot=new THREE.Mesh(new THREE.ConeGeometry(.08,.12,8),M(col,.3));knot.position.y=-.68;knot.rotation.x=Math.PI;g.add(knot);
  const pts=[];for(let k=0;k<12;k++)pts.push(new THREE.Vector3(Math.sin(k*.9)*.06,-.74-k*.22,0));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xddd0e6,transparent:true,opacity:.5})));
  const a=-Math.PI*.15+i/6*(-Math.PI*.7)-.35, r=4.6+(i%2)*1.4;
  g.userData={x:Math.cos(a)*r,z:Math.sin(a)*r-1.2,y:5+(i%3)*.9,ph:Math.random()*6,popped:false,s:1};
  g.position.set(g.userData.x,g.userData.y,g.userData.z);b.userData.balloon=g;scene.add(g);balloons.push(g);
}

/* stars */
const starGeo=new THREE.BufferGeometry();const SN=900;const sp=new Float32Array(SN*3);
for(let i=0;i<SN;i++){const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*.45,R=50;sp[i*3]=R*Math.sin(ph)*Math.cos(th);sp[i*3+1]=R*Math.cos(ph)*.7+4;sp[i*3+2]=R*Math.sin(ph)*Math.sin(th)}
starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xfff4e8,size:.14,transparent:true,opacity:.75,fog:false}));scene.add(stars);

/* drifting gold dust */
const dGeo=new THREE.BufferGeometry();const DN=160;const dp=new Float32Array(DN*3);
for(let i=0;i<DN;i++){dp[i*3]=(Math.random()-.5)*14;dp[i*3+1]=Math.random()*9;dp[i*3+2]=(Math.random()-.5)*14}
dGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dGeo,new THREE.PointsMaterial({color:0xf3c56b,size:.05,transparent:true,opacity:.8}));scene.add(dust);

/* ================= effects ================= */
const confetti=[],smoke=[],fireworks=[];
const cGeo=new THREE.PlaneGeometry(.1,.17);const cCols=[0xf3c56b,0xf2a7b8,0x7fd3c8,0xfff4e8,0x8a4fa0,0xd8324a];
function burstConfetti(origin,count){
  for(let i=0;i<count;i++){
    const m=new THREE.Mesh(cGeo,new THREE.MeshBasicMaterial({color:cCols[i%6],side:THREE.DoubleSide}));m.position.copy(origin);
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*4.5;
    m.userData={v:new THREE.Vector3(Math.cos(a)*s,5+Math.random()*7,Math.sin(a)*s),r:new THREE.Vector3(Math.random()*9,Math.random()*9,0),life:0,ph:Math.random()*6};
    scene.add(m);confetti.push(m);
  }
}
const smokeGeo=new THREE.SphereGeometry(.06,8,8);
function puff(obj){
  const wp=new THREE.Vector3();obj.getWorldPosition(wp);
  for(let i=0;i<7;i++){const m=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0xbfb5c8,transparent:true,opacity:.45,depthWrite:false}));
    m.position.copy(wp);m.userData={v:new THREE.Vector3((Math.random()-.5)*.25,.55+Math.random()*.5,(Math.random()-.5)*.25),life:0};scene.add(m);smoke.push(m)}
}
const fwCols=[0xf3c56b,0xf2a7b8,0x7fd3c8,0xfff4e8,0xff6b8a,0xb98bff];
function firework(){
  const n=140,pos=new Float32Array(n*3),vel=[];
  const o=new THREE.Vector3((Math.random()-.5)*14,8+Math.random()*4,-7-Math.random()*6);
  for(let i=0;i<n;i++){pos[i*3]=o.x;pos[i*3+1]=o.y;pos[i*3+2]=o.z;
    const u=Math.random()*2-1,th=Math.random()*Math.PI*2,s=3+Math.random()*.8,q=Math.sqrt(1-u*u);vel.push(new THREE.Vector3(q*Math.cos(th)*s,u*s,q*Math.sin(th)*s))}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const col=fwCols[Math.floor(Math.random()*fwCols.length)];
  const p=new THREE.Points(g,new THREE.PointsMaterial({color:col,size:.2,transparent:true,opacity:1,fog:false,depthWrite:false,blending:THREE.AdditiveBlending}));
  p.userData={vel,life:0};scene.add(p);fireworks.push(p);
  fwLight.color.setHex(col);fwLight.position.copy(o);fwLight.intensity=3;
  boom(.25+Math.random()*.2);
}
let fwTimer=null;
function fireworkShow(seconds){clearInterval(fwTimer);let t=0;firework();fwTimer=setInterval(()=>{firework();if(Math.random()<.5)setTimeout(firework,180);t+=.7;if(t>seconds)clearInterval(fwTimer)},700)}

/* ================= audio ================= */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function boom(v){const c=ac();if(!c)return;const len=c.sampleRate*.6,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=900;g.gain.value=v*.6;
  s.connect(f).connect(g).connect(c.destination);s.start()}
function pop(){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(400,c.currentTime);o.frequency.exponentialRampToValueAtTime(60,c.currentTime+.08);
  g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.12)}
function chime(){const c=ac();if(!c)return;[1318.5,1568,2093].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;const t=c.currentTime+i*.09;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g).connect(c.destination);o.start(t);o.stop(t+1)})}
function song(){
  const c=ac();if(!c)return;
  const n={G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784,C4:261.6,F4:349.2,G3:196};
  const seq=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
    ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
  const bass=[['C4',3],['G3',3],['G3',3],['C4',3],['C4',3],['F4',3],['C4',2],['G3',1],['C4',3]];
  let t=c.currentTime+.6;const beat=.4;
  const play=(f,start,dur,type,vol)=>{const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();o.type=type;o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
    g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.015);g.gain.exponentialRampToValueAtTime(.0008,start+dur*1.4);
    o.connect(g);o2.connect(g);g.connect(c.destination);o.start(start);o2.start(start);o.stop(start+dur*1.5);o2.stop(start+dur*1.5)};
  let tt=t;seq.forEach(([k,d])=>{play(n[k],tt,d*beat,'triangle',.11);tt+=d*beat});
  let tb=t;bass.forEach(([k,d])=>{play(n[k]/2,tb,d*beat,'sine',.09);tb+=d*beat});
}

/* ================= interaction ================= */
let dragging=false,moved=0,lx=0,vel=0,userRot=0;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;lx=e.clientX;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lx;lx=e.clientX;moved+=Math.abs(dx);vel=dx*.007;userRot+=vel});
canvas.addEventListener('pointerup',e=>{dragging=false;if(moved<8)tap(e)});
function tap(e){
  if(!started)return;
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const ch=ray.intersectObjects(cats,true);
  if(ch.length){const c=ch[0].object.userData.cat;if(c&&c.userData.jump<=0){c.userData.jump=1;meow();try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}return}
  const bh=ray.intersectObjects(balloons.map(b=>b.children[0]));
  if(bh.length){popBalloon(bh[0].object.userData.balloon);return}
  const h=ray.intersectObjects(hits);
  if(h.length){const f=flames[h[0].object.userData.i];if(f.on){snuff(f);checkAll()}else if(!finished){f.on=true;chime()}}
}
function snuff(f){if(!f.on)return;f.on=false;puff(f.g);ac();try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}}
function popBalloon(b){
  if(b.userData.popped)return;b.userData.popped=true;pop();
  const wp=b.position.clone();burstConfetti(wp,40);try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}
  setTimeout(()=>{b.userData.popped=false;b.userData.s=0;b.position.y=-2},4000);
}
function checkAll(){if(!finished&&flames.every(f=>!f.on))celebrate()}

/* blow detection with the mic */
let micStream=null,analyser=null,blowAcc=0;
$('blow').addEventListener('click',async()=>{
  ac();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){blowAll();return}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=actx.createMediaStreamSource(micStream);analyser=actx.createAnalyser();analyser.fftSize=512;src.connect(analyser);
    $('meter').classList.add('on');$('hint').innerHTML='nesfi fl mic';
    $('blow').style.visibility='hidden';
    setTimeout(()=>{if(!finished&&analyser){blowAll()}},12000);
  }catch(err){blowAll()}
});
function blowAll(){flames.forEach((f,i)=>setTimeout(()=>{snuff(f);if(i===N-1)checkAll()},i*110))}
const micBuf=new Uint8Array(512);
function readMic(dt){
  if(!analyser||finished)return;
  analyser.getByteTimeDomainData(micBuf);let s=0;for(let i=0;i<micBuf.length;i++){const v=(micBuf[i]-128)/128;s+=v*v}
  const rms=Math.sqrt(s/micBuf.length);$('meter').firstElementChild.style.width=Math.min(100,rms*400)+'%';
  flames.forEach(f=>f.lean=Math.min(1,rms*6));
  if(rms>.12){blowAcc+=dt;if(blowAcc>.12){const lit=flames.filter(f=>f.on);if(lit.length){snuff(lit[Math.floor(Math.random()*lit.length)]);blowAcc=0;checkAll()}}}
  else blowAcc=Math.max(0,blowAcc-dt*.5);
}
function stopMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}analyser=null;$('meter').classList.remove('on');flames.forEach(f=>f.lean=0)}

/* celebrate */
let finished=false,typing=null;
function celebrate(){
  finished=true;stopMic();
  $('bottom').classList.add('gone');
  setTimeout(()=>{burstConfetti(new THREE.Vector3(0,TOP+.5,0),320);song();fireworkShow(9);try{navigator.vibrate&&navigator.vibrate([40,60,40,60,120])}catch(_){}},350);
  setTimeout(()=>{$('letter').classList.add('show');typeLetter()},2600);
}
function typeLetter(){
  const el=$('txt');clearInterval(typing);let i=0;el.innerHTML='<span class="cur"></span>';
  typing=setInterval(()=>{i++;el.textContent=LETTER.slice(0,i);const c=document.createElement('span');c.className='cur';el.appendChild(c);if(i>=LETTER.length){clearInterval(typing)}},45);
}
$('close').addEventListener('click',()=>$('letter').classList.remove('show'));
$('again').addEventListener('click',()=>{
  $('letter').classList.remove('show');finished=false;flames.forEach(f=>f.on=true);chime();
  $('bottom').classList.remove('gone');$('blow').style.visibility='';$('hint').innerHTML='allow acces ll mic and nesfi fl mic';
});

/* intro */
let started=false;
$('env').addEventListener('click',()=>{
  if(started)return;started=true;ac();chime();
  $('env').classList.add('open');
  setTimeout(()=>{$('intro').classList.add('out');$('hud').classList.add('on');introT=0;
    setTimeout(()=>toast('اضغطي على القطط والبالونات، واسحبي باش تدوّري الكعكة'),2200)},700);
});
let toastT=null;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3800)}

/* countdown to midnight */
const target=new Date(2026,10,7,0,0,0);let wasBefore=Date.now()<target;
function updateCount(){
  const d=target-Date.now(),el=$('count');
  if(d>0){const h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);
    el.innerHTML='until midnight · <b>'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'</b>'}
  else{el.innerHTML='<b>اليوم عيدك</b>';if(wasBefore){wasBefore=false;if(started){fireworkShow(6);burstConfetti(new THREE.Vector3(0,6,0),200);toast('دخلنا السبعة نوفمبر! عيد ميلاد سعيد')}}}
}
updateCount();setInterval(updateCount,1000);

/* layout */
let camZ=12,camY=6,lookY=2.2;
function resize(){
  const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const portrait=w/h<.85;camera.fov=portrait?50:40;
  camZ=portrait?14.5:12;camY=portrait?6.6:5.6;lookY=portrait?2.0:2.3;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

/* ================= loop ================= */
const clock=new THREE.Clock();let introT=-1;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function ease(x){return 1-Math.pow(1-x,3)}
function tick(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // camera: slow dolly-in after the envelope opens
  let k=1;if(introT>=0&&introT<1){introT+=dt/3.2;k=ease(Math.min(1,introT))}else if(introT<0)k=0;
  const z=camZ+ (1-k)*9, y=camY+(1-k)*3;
  camera.position.set(Math.sin(t*.08)*.6,y,z);camera.lookAt(0,lookY,0);
  if(!dragging){vel*=.95;userRot+=vel}
  cake.rotation.y=userRot+(reduce?0:t*.22);
  let lit=0;
  flames.forEach(f=>{
    f.s+=((f.on?1:0)-f.s)*.2;const fl=1+Math.sin(t*14+f.phase)*.08+Math.sin(t*23+f.phase)*.05;
    f.g.scale.set(f.s*fl,f.s*(fl+.12),f.s*fl);f.g.visible=f.s>.02;
    f.g.position.x=f.base.x+Math.sin(t*9+f.phase)*.012;f.g.rotation.z=-f.lean*.5;f.g.position.y=f.base.y-f.lean*.05;lit+=f.s;
  });
  cats.forEach(c=>{const u=c.userData;const a=u.a0+t*u.speed*(finished?1.6:1)*(reduce?.3:1);const R=1.7;
    c.position.set(Math.cos(a)*R,T2,Math.sin(a)*R);c.rotation.y=-a-Math.PI/2;
    const run=t*u.speed*14+u.ph;
    if(u.jump>0){u.jump-=dt*1.6;c.position.y+=Math.sin((1-Math.max(0,u.jump))*Math.PI)*.45}
    c.position.y+=Math.abs(Math.sin(run))*.035;
    u.legs.forEach((l,i)=>{l.rotation.z=Math.sin(run+(i===0||i===3?0:Math.PI))*.7});
    u.tail.forEach((sg,i)=>{sg.rotation.z=-.3+Math.sin(run*.5+i*.6)*.15;sg.rotation.y=Math.sin(t*3+i*.5+u.ph)*.18});
    u.head.rotation.z=Math.sin(run)*.06;u.head.rotation.y=Math.sin(t*1.3+u.ph)*.25;});
  warm.intensity=(lit/N)*(2+Math.sin(t*17)*.2);
  fwLight.intensity*=.92;
  readMic(dt);
  balloons.forEach((b,i)=>{const u=b.userData;
    if(u.popped){b.scale.setScalar(Math.max(.001,b.scale.x*.6));return}
    u.s=Math.min(1,u.s+dt*.6);b.scale.setScalar(Math.max(.001,u.s));
    const ty=u.y+Math.sin(t*.8+u.ph)*.35;b.position.y+=(ty-b.position.y)*.03;b.position.x=u.x+Math.sin(t*.5+u.ph)*.25;b.rotation.z=Math.sin(t*.7+u.ph)*.08});
  const p=dGeo.attributes.position.array;for(let i=0;i<DN;i++){p[i*3+1]+=dt*.22;if(p[i*3+1]>9)p[i*3+1]=0}dGeo.attributes.position.needsUpdate=true;dust.rotation.y=t*.03;
  stars.material.opacity=.6+Math.sin(t*.7)*.15;
  for(let i=confetti.length-1;i>=0;i--){const m=confetti[i],u=m.userData;u.life+=dt;u.v.y-=8.5*dt;u.v.x*=.985;u.v.z*=.985;if(u.v.y<-2.2)u.v.y=-2.2;
    m.position.addScaledVector(u.v,dt);m.position.x+=Math.sin(t*3+u.ph)*dt*.4;m.rotation.x+=u.r.x*dt;m.rotation.y+=u.r.y*dt;
    if(m.position.y<.05){m.position.y=.05;u.v.set(0,0,0);u.r.set(0,0,0)}
    if(u.life>10){scene.remove(m);m.material.dispose();confetti.splice(i,1)}}
  for(let i=smoke.length-1;i>=0;i--){const m=smoke[i],u=m.userData;u.life+=dt;m.position.addScaledVector(u.v,dt);m.scale.setScalar(1+u.life*3);
    m.material.opacity=Math.max(0,.45-u.life*.3);if(u.life>1.5){scene.remove(m);m.material.dispose();smoke.splice(i,1)}}
  for(let i=fireworks.length-1;i>=0;i--){const f=fireworks[i],u=f.userData;u.life+=dt;const a=f.geometry.attributes.position.array;
    for(let j=0;j<u.vel.length;j++){const v=u.vel[j];v.multiplyScalar(.965);v.y-=1.6*dt;a[j*3]+=v.x*dt;a[j*3+1]+=v.y*dt;a[j*3+2]+=v.z*dt}
    f.geometry.attributes.position.needsUpdate=true;f.material.opacity=Math.max(0,1-u.life/2.2);f.material.size=.2*(1-u.life/3);
    if(u.life>2.2){scene.remove(f);f.geometry.dispose();f.material.dispose();fireworks.splice(i,1)}}
  renderer.render(scene,camera);requestAnimationFrame(tick);
}
tick();
})();
